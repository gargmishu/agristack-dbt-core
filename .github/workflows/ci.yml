name: Zero-Trust DPI Quality & Security Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-security-gate:
    name: Lint, Strict Typecheck, Test & Pilot Simulation (Python ${{ matrix.python-version }})
    # Environment Rationale:
    # 1. Production Parity: Deployments, Docker containers, and sovereign cloud infrastructure
    #    (e.g., MeitY / NIC cloud in India) run on Linux (Ubuntu/Debian). Running CI on Ubuntu
    #    mirrors production reality.
    # 2. CI Performance & Cost: Ubuntu runners provision and boot in seconds on GitHub Actions
    #    with optimal resource utilization.
    # 3. Native Tooling: C-extensions, SQLite, OpenSSL, and Python packages install natively
    #    without cross-platform path or shell formatting quirks.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python Matrix Strategy:
        # - 3.11: Minimum supported baseline declared in pyproject.toml (ensures compatibility with
        #   LTS enterprise distributions like Debian 12 / Ubuntu 22.04 LTS).
        # - 3.12: Modern stable target (guarantees forward compatibility without breaking baseline).
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter (Security & Clean Code Rules)
        run: ruff check src tests scripts

      - name: Verify Ruff Formatting
        run: ruff format --check src tests scripts

      - name: Run Mypy Strict Type Checking
        run: mypy src tests scripts/run_pilot_simulation.py

      - name: Run Full Unit, Integration & Zero-Trust Security Test Suite
        run: pytest

      - name: Run End-to-End 60-Day Pilot Simulation & Audit Smoke Test
        env:
          PYTHONPATH: "."
        run: python scripts/run_pilot_simulation.py
