# ==============================================================================
# CDPI 2026 DPI-AI Framework — Canonical DPI Workflow Specification (YAML)
# Reference: https://digitalpublicinfrastructure.ai/dpi-workflows.php
# Vision Paper Template: Pages 19–22 ("Generic DPI Workflow Template (YAML)")
# Implementation: https://github.com/gargmishu/agristack-dbt-core
# ==============================================================================

workflow:
  id: "wf-crop-loss-subsidy-2026"
  name: "autonomous_multi_channel_farmer_subsidy_system"
  version: "1.0.0"
  description: >-
    Governed multi-channel (IVR Voice, WhatsApp, USSD, SMS) farmer crop-loss relief
    and Direct Benefit Transfer (DBT) workflow enforcing Layer-2 Zero-Trust
    HMAC-SHA256 PII tokenization, three-gate deterministic eligibility
    governance, human-in-the-loop (HITL) caseworker escalation, and G2P Connect
    (DCI) v1.0.0 signed asynchronous registry search and treasury disbursement.
  domain: "agriculture_and_social_protection_dbt"

governance:
  owner_agency: "Department of Agriculture & Farmers Welfare (Sovereign / State Nodal Agency)"
  legal_basis: "Digital Personal Data Protection (DPDP) Act 2023 & Sovereign Direct Benefit Transfer (DBT) Authorization Mandate"
  audit_logging: true
  human_oversight:
    required: true
    confidence_threshold: 0.85
    max_conversational_attempts: 3
    escalation_to: "district_agricultural_officer_hitl"
    retention_policy: "5y"
  accountability_note: >-
    Public Agents orchestrate steps; institutional authority remains with
    government. No AI Block or Public Agent can directly mutate authoritative
    registries or authorize treasury disbursements outside deterministic
    workflow gates.

actors:
  public_agent:
    id: "pa-farmer-subsidy-gateway-2026"
    channels: ["ivr_voice", "whatsapp", "ussd", "sms"]
    languages: ["hi-IN", "en-IN"]
  human_agent:
    id: "district_agricultural_officer_hitl"
    role: "District Agricultural Officer / Caseworker Adjudicator"

inputs:
  requester:
    identifier:
      type: string
      format: "hmac_sha256_token | national_id | phone"
      required: true
      example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      validation: "^[a-f0-9]{64}$"
    consent_token:
      type: string
      format: "channel_native_opt_in | jwt"
      required: true
      validation: "must_be_explicit_affirmative_opt_in"
  request:
    payload:
      type: object
      schema_ref: "src/data_models/public_agent/intake_contracts.py#StandardizedIntakeContract"
      required: true
      additional_properties: false
    attachments:
      type: array
      required: false

# ==============================================================================
# Modular Callable AI Blocks & DPG Building Blocks (MCP & OpenAPI Ready)
# Reference: Vision Paper Pages 16, 21, and 29 ("DPGs as AI Blocks")
# ==============================================================================
ai_blocks:
  - name: "speech_to_text"
    kind: "foundational"
    interface: "speech_to_text(audio_stream_uri, source_language)"
    provider: "Digital India BHASHINI ASR Cluster"
    io:
      in: ["request.payload.ivr_audio_stream_uri", "request.payload.source_language"]
      out: ["unstructured_vernacular_string", "asr_confidence"]
    governance:
      purpose: "Transcribe rural telephony 16kHz PCM voice streams into vernacular text"
      data_minimization: true
      logging: true
      fallback: "escalate_to_human_agent"

  - name: "translate"
    kind: "foundational"
    interface: "translate_local_language(unstructured_text, source_language, target_language)"
    provider: "Digital India BHASHINI NMT Hub"
    io:
      in: ["unstructured_vernacular_string", "source_language", "target_language"]
      out: ["standardized_english_string"]
    governance:
      purpose: "Normalize regional agricultural dialects (e.g., Haryanvi/Hindi) into canonical administrative text"
      data_minimization: true
      logging: true
      fallback: "escalate_to_human_agent"

  - name: "structured_extract"
    kind: "sector_specific"
    interface: "extract_claim_entities(standardized_english_string)"
    provider: "Sovereign On-Premises Small Language Model (vLLM / Ollama)"
    io:
      in: ["standardized_english_string"]
      out: ["extracted_entities", "extraction_confidence"]
    governance:
      purpose: "Extract bounded agricultural claim parameters (district, crop_type, damage_cause) under strict schema validation"
      data_minimization: true
      logging: true
      fallback: "reprompt_or_escalate_to_human_agent"

  - name: "identity_verify"
    kind: "sector_specific"
    interface: "verify_identity(raw_national_id_or_phone)"
    provider: "Layer-2 Zero-Trust Security Gateway (HMAC-SHA256 + MOSIP / National ID Pattern)"
    io:
      in: ["requester.identifier"]
      out: ["tokenized_identity_hash", "identity_verified"]
    governance:
      purpose: "Convert cleartext citizen identifiers in volatile RAM into irreversible 64-char HMAC-SHA256 tokens before any downstream call"
      data_minimization: true
      logging: true
      fallback: "abort_session_with_rfc7807_error"

  - name: "registry_search"
    kind: "sector_specific"
    interface: "fetch_verified_record(tokenized_identity_hash, benefit_program_code)"
    provider: "Federated AgriStack Registry (Farmer, Farmland Plot, & Crop Sown Registries via G2P Connect v1.0.0 search/on-search)"
    io:
      in: ["tokenized_identity_hash", "extracted_entities.district_name", "extracted_entities.crop_type"]
      out: ["registry_match_flag", "cadastral_plot_id", "sown_crop_verified"]
    governance:
      purpose: "Verify land parcel ownership and seasonal crop sown provenance using pseudonymized identity tokens"
      data_minimization: true
      logging: true
      fallback: "escalate_to_human_agent"

  - name: "check_benefit_eligibility"
    kind: "sector_specific"
    interface: "check_benefit_eligibility(extraction_confidence, registry_match_flag, attempt_number)"
    provider: "Deterministic Three-Gate Governance Engine & OpenSPP / OpenG2P Case Registry"
    io:
      in: ["extraction_confidence", "registry_match_flag", "attempt_number"]
      out: ["evaluation_passed", "routing_decision", "openspp_case_id"]
    governance:
      purpose: "Enforce deterministic >=0.85 confidence threshold, registry provenance match, and 3-strike conversational retry ceiling"
      data_minimization: true
      logging: true
      fallback: "escalate_to_human_agent"

  - name: "payment_disburse"
    kind: "sector_specific"
    interface: "transfer_funds(openspp_case_id, tokenized_identity_hash, benefit_program_code)"
    provider: "G2P Connect (DCI) v1.0.0 Disbursement Envelope Mapper & NPCI APBS / PFMS / Mojaloop Treasury Rail"
    io:
      in: ["openspp_case_id", "tokenized_identity_hash", "benefit_program_code"]
      out: ["payment_transaction_id", "payout_clearance_status"]
    governance:
      purpose: "Emit cryptographically signed, idempotent G2P Connect v1.0.0 disbursement instructions and reconcile asynchronous on-disburse callbacks"
      data_minimization: true
      logging: true
      fallback: "stage_for_manual_treasury_reconciliation"

  - name: "text_to_speech"
    kind: "foundational"
    interface: "text_to_speech(confirmation_message, target_language)"
    provider: "Digital India BHASHINI TTS Hub & CDAC Mobile Seva SMS Gateway"
    io:
      in: ["confirmation_message", "target_language", "ingress_channel"]
      out: ["channel_delivery_receipt"]
    governance:
      purpose: "Deliver accessible voice, WhatsApp, USSD, and transactional SMS confirmation receipts or caseworker escalation IDs"
      data_minimization: true
      logging: true
      fallback: "send_transactional_sms_receipt"

# ==============================================================================
# Callable UN Universal DPI Safeguards Block
# Reference: Vision Paper Page 18 & Page 21 ("Safeguards as Callable AI Blocks")
# ==============================================================================
safeguards:
  enabled: true
  callable_ai_block: "verify_zero_trust_safeguards()"
  checks:
    - "consent_present"
    - "purpose_limitation"
    - "data_minimization"
    - "zero_cleartext_pii_retention"
    - "adversarial_prompt_injection_firewall"
    - "non_discrimination"
    - "explainability_ready"
  on_failure:
    action: "escalate"
    to: "district_agricultural_officer_hitl"
    citizen_message: >-
      Your subsidy claim has been safely queued for assisted review by a
      District Agricultural Officer. Your reference Case ID has been sent via SMS.

# ==============================================================================
# Auditable 12-Step DPI Workflow Sequence
# ==============================================================================
steps:
  - id: "step_01_consent_and_channel_entry"
    call: "verify_zero_trust_safeguards()"
    condition: "request.payload.ingress_channel in ['IVR_VOICE', 'WHATSAPP', 'USSD', 'SMS']"
    description: "Capture explicit channel-native citizen opt-in (IVR DTMF '1', WhatsApp opt-in button, USSD menu '1', or SMS opt-in keyword) prior to any processing."
    on_success: "step_02_speech_to_text_transcription"
    on_failure:
      action: "stop"
      to: "district_agricultural_officer_hitl"
      citizen_message: "Explicit consent is required to verify your farmer registry records. Session closed without storing any data."

  - id: "step_02_speech_to_text_transcription"
    call: "speech_to_text"
    condition: "request.payload.ingress_channel == 'IVR_VOICE' or (request.payload.ingress_channel == 'WHATSAPP' and request.payload.payload_type == 'AUDIO')"
    description: "Transcribe incoming 16kHz mono PCM rural voice stream or WhatsApp audio note via BHASHINI ASR; bypass for text WhatsApp, SMS, and USSD."
    on_success: "step_03_text_translation_and_normalization"
    on_failure:
      action: "escalate"
      retry: { max_attempts: 2, backoff: "exponential" }
      to: "district_agricultural_officer_hitl"
      citizen_message: "Audio quality was unclear. Routing your call to an assisted caseworker."

  - id: "step_03_text_translation_and_normalization"
    call: "translate"
    condition: "request.payload.ingress_channel in ['IVR_VOICE', 'WHATSAPP', 'SMS']"
    description: "Translate vernacular script (from IVR ASR, WhatsApp, or SMS) into standardized administrative text via BHASHINI NMT while enforcing adversarial prompt-injection firewall checks."
    on_success: "step_04_structured_field_entity_extraction"
    on_failure:
      action: "escalate"
      retry: { max_attempts: 2, backoff: "exponential" }
      to: "district_agricultural_officer_hitl"
      citizen_message: "We could not translate your message automatically. A District Officer will review your request."

  - id: "step_04_structured_field_entity_extraction"
    call: "structured_extract"
    condition: "request.payload.ingress_channel in ['IVR_VOICE', 'WHATSAPP', 'SMS']"
    description: "Extract structured claim entities (district, crop_type, damage_cause) from IVR Voice, WhatsApp, or SMS text via sovereign SLM; zero confidence score immediately if prompt injection is detected."
    on_success: "step_05_identity_perimeter_tokenization"
    on_failure:
      action: "fallback"
      to: "step_08_governance_threshold_evaluation"
      citizen_message: "Please clarify your district and damaged crop so we can verify your land record."

  - id: "step_05_identity_perimeter_tokenization"
    call: "identity_verify"
    description: "Tokenize raw citizen/farmer identifier in volatile RAM using HMAC-SHA256 with a managed secret pepper (`tkn_<64-hex>`) and purge cleartext from memory."
    on_success: "step_05b_analytical_session_deduplication"
    on_failure:
      action: "stop"
      to: "district_agricultural_officer_hitl"
      citizen_message: "Unable to validate your identity token format. Please retry or visit an assisted service counter."

  - id: "step_05b_analytical_session_deduplication"
    call: "staging_committed_extractions_view"
    condition: "request.payload.ingress_channel in ['IVR_VOICE', 'WHATSAPP', 'SMS']"
    description: "Compact multi-attempt conversational turns (IVR Voice, WhatsApp, SMS) via ANSI SQL window functions (`ROW_NUMBER() OVER (PARTITION BY session_id ORDER BY attempt_number DESC)`) so only the latest verified turn enters registry matching."
    on_success: "step_06_agricultural_registry_crossmatch"
    on_failure:
      action: "escalate"
      to: "district_agricultural_officer_hitl"
      citizen_message: "Session state error detected. Escalating to a human caseworker."

  - id: "step_06_agricultural_registry_crossmatch"
    call: "registry_search"
    description: "Query Federated AgriStack Farmer, Farmland Plot, and Crop Sown Registries via signed G2P Connect v1.0.0 `search` / `on-search` envelopes using only the tokenized identity hash."
    on_success: "step_07_social_benefits_registry_submission"
    on_failure:
      action: "fallback"
      to: "step_08_governance_threshold_evaluation"
      citizen_message: "Your land or seasonal crop record could not be automatically matched."

  - id: "step_07_social_benefits_registry_submission"
    call: "check_benefit_eligibility"
    condition: "registry_match_flag == true"
    description: "Stage the verified claim record in the OpenSPP / OpenG2P social protection ledger pending governance gate clearance."
    on_success: "step_08_governance_threshold_evaluation"
    on_failure:
      action: "escalate"
      to: "district_agricultural_officer_hitl"
      citizen_message: "Your claim has been queued for manual registration by a District Officer."

  - id: "step_08_governance_threshold_evaluation"
    call: "check_benefit_eligibility"
    description: "Evaluate Three-Gate Governance Matrix: Gate 1 (extraction_confidence >= 0.85, or 1.00 for deterministic USSD), Gate 2 (AgriStack registry_match_flag == true), and Gate 3 (attempt_number <= 3)."
    on_success: "step_09_governance_routing_engine"
    on_failure:
      action: "fallback"
      to: "step_09_governance_routing_engine"
      citizen_message: "Evaluating routing path based on governance thresholds."

  - id: "step_09_governance_routing_engine"
    call: "check_benefit_eligibility"
    description: "Route deterministically to: (a) step_10 automated payout if all gates pass, (b) conversational re-prompt if attempt_number < 3 on IVR Voice, WhatsApp, or SMS, or (c) step_11 human caseworker queue if attempt_number >= 3 or USSD mismatch."
    on_success: "step_10_automated_payout_disbursement"
    on_failure:
      action: "escalate"
      to: "step_11_caseworker_incident_staging"
      citizen_message: "Routing your application to a District Agricultural Officer for manual review."

  - id: "step_10_automated_payout_disbursement"
    call: "payment_disburse"
    condition: "evaluation_passed == true"
    description: "Emit signed G2P Connect (DCI) v1.0.0 `disburse` envelope with idempotency key bound to `openspp_case_id` and reconcile asynchronous `on-disburse` settlement webhooks."
    on_success: "step_12_adaptive_multichannel_confirmation_delivery"
    on_failure:
      action: "escalate"
      to: "step_11_caseworker_incident_staging"
      citizen_message: "Treasury settlement requires officer verification. Your Case ID has been generated."

  - id: "step_11_caseworker_incident_staging"
    call: "human_review"
    condition: "evaluation_passed == false"
    description: "Generate cryptographically tracked `SPP-CASE-` ticket in the District Agricultural Officer HITL adjudication queue with full redacted audit context."
    on_success: "step_12_adaptive_multichannel_confirmation_delivery"
    on_failure:
      action: "stop"
      to: "district_agricultural_officer_hitl"
      citizen_message: "Your claim is queued for priority officer review."

  - id: "step_12_adaptive_multichannel_confirmation_delivery"
    call: "text_to_speech"
    condition: "request.payload.ingress_channel in ['IVR_VOICE', 'WHATSAPP', 'USSD', 'SMS']"
    description: "Dispatch final DBT payment transaction receipt or HITL escalation Case ID across the citizen's native channel (BHASHINI TTS audio for IVR Voice, rich card for WhatsApp, compact <=160-char plain text for USSD and SMS)."
    on_success: "workflow_completed"
    on_failure:
      action: "fallback"
      to: "district_agricultural_officer_hitl"
      citizen_message: "Confirmation SMS queued via backup telecom gateway."

outputs:
  status: "success | escalated | reprompt | failed"
  decision:
    claim_id: "string"
    governance_status: "APPROVED_FOR_DISBURSEMENT | ESCALATED_TO_CASEWORKER | REPROMPT_REQUESTED"
    payment_transaction_id: "string | null"
    escalation_case_id: "string | null"
  audit_trail_ref: "application_governance_ledger_history.history_entry_id"

logging:
  level: "INFO"
  destination: "stdout | postgresql_append_only_ledger"
  format: "json"
  events:
    - "workflow_started"
    - "consent_verified"
    - "ai_block_called"
    - "pii_tokenized_at_perimeter"
    - "safeguards_checked"
    - "registry_crossmatched"
    - "decision_made"
    - "g2p_connect_envelope_dispatched"
    - "escalation_triggered"
    - "workflow_completed"
  redaction:
    pii_fields:
      - "requester.identifier"
      - "requester.consent_token"
      - "request.payload.source_phone_number"
      - "request.payload.farmer_id_cleartext"
      - "request.payload.aadhaar_number"
