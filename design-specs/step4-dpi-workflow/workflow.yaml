# ==============================================================================
# CDPI 2026 DPI-AI Framework — Canonical DPI Workflow Specification (YAML)
# Reference: https://digitalpublicinfrastructure.ai/dpi-workflows.php
# Vision Paper Template: Pages 19–22 ("Generic DPI Workflow Template (YAML)")
# Implementation: https://github.com/gargmishu/agristack-dbt-core
# ==============================================================================

workflow:
  id: "wf-crop-loss-subsidy-2026"
  name: "autonomous_multi_channel_farmer_subsidy_system"
  version: "1.0.0"
  description: >-
    Governed multi-channel (IVR Voice, WhatsApp, USSD, SMS) farmer crop-loss relief
    and Direct Benefit Transfer (DBT) workflow enforcing Layer-2 Zero-Trust
    HMAC-SHA256 PII tokenization, three-gate deterministic eligibility
    governance, human-in-the-loop (HITL) caseworker escalation, and G2P Connect
    (DCI) v1.0.0 signed asynchronous registry search and treasury disbursement.
  domain: "agriculture_and_social_protection_dbt"

governance:
  owner_agency: "Department of Agriculture & Farmers Welfare (Sovereign / State Nodal Agency)"
  legal_basis: "Digital Personal Data Protection (DPDP) Act 2023 & Sovereign Direct Benefit Transfer (DBT) Authorization Mandate"
  audit_logging: true
  human_oversight:
    required: true
    confidence_threshold: 0.85
    max_conversational_attempts: 3
    escalation_to: "district_agricultural_officer_hitl"
    retention_policy: "5y"
  accountability_note: >-
    Public Agents orchestrate steps; institutional authority remains with
    government. No AI Block or Public Agent can directly mutate authoritative
    registries or authorize treasury disbursements outside deterministic
    workflow gates.

actors:
  public_agent:
    id: "pa-farmer-subsidy-gateway-2026"
    channels: ["ivr_voice", "whatsapp", "ussd", "sms"]
    languages: ["hi-IN", "en-IN", "mr-IN", "te-IN", "ta-IN", "gu-IN", "kn-IN", "bn-IN", "pa-IN", "or-IN", "ml-IN"]
  human_agent:
    id: "district_agricultural_officer_hitl"
    role: "District Agricultural Officer / Caseworker Adjudicator"

inputs:
  requester:
    identifier:
      type: string
      format: "hmac_sha256_token | national_id | phone"
      required: true
      example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      validation: "^[a-fA-F0-9]{64}$"
    consent_token:
      type: string
      format: "channel_native_opt_in | jwt"
      required: true
      validation: "must_be_explicit_affirmative_opt_in"
  request:
    payload:
      type: object
      schema_ref: "src/data_models/public_agent/standardized_intake_payload.py#PublicAgentStandardizedIntakePayload"
      required: true
      additional_properties: false
    attachments:
      type: array
      required: false

# ==============================================================================
# Modular Callable AI Blocks & DPG Building Blocks (MCP & OpenAPI Ready)
# Reference: Vision Paper Pages 16, 21, and 29 ("DPGs as AI Blocks")
# ==============================================================================
ai_blocks:
  - name: "speech_to_text"
    kind: "foundational"
    interface: "BhashiniService.transcribe_audio(audio_url, language_locale)"
    provider: "Digital India BHASHINI Stateless ASR Model API (POST /v1/asr/transcribe; invoked on 8kHz/16kHz audio captured by Layer 1 VoicEra / SIP Telephony Edge)"
    io:
      in: ["request.payload.unprocessed_input_content", "request.payload.language_locale"]
      out: ["transcribed_vernacular_text"]
    governance:
      purpose: "Stateless Layer 3 ASR model inference converting rural 8kHz GSM/PSTN audio (captured via COSS/EkStep's self-hosted VoicEra <₹1/min telephony & Pipecat VAD/barge-in runtime) and 16kHz PCM voice streams into Indic text"
      data_minimization: true
      logging: true
      fallback: "low_confidence_fallback_0_40_to_human_agent"

  - name: "translate"
    kind: "foundational"
    interface: "BhashiniService.translate_text(text, source_locale, target_locale='en-IN')"
    provider: "Digital India BHASHINI NMT Hub (POST /v1/nmt/translate)"
    io:
      in: ["transcribed_or_raw_text", "request.payload.language_locale", "target_locale"]
      out: ["standardized_english_text"]
    governance:
      purpose: "Normalize regional agricultural dialects across 11 scheduled Indian languages into canonical administrative text"
      data_minimization: true
      logging: true
      fallback: "escalate_to_human_agent"

  - name: "structured_extract"
    kind: "sector_specific"
    interface: "SlmExtractor.extract_entities(session_id, unprocessed_content, language_locale)"
    provider: "Sovereign On-Premises Small Language Model (vLLM / Ollama POST /v1/extract)"
    io:
      in: ["request.payload.session_id", "standardized_english_text", "request.payload.language_locale"]
      out:
        - "extracted_entity_payload.application_intent"
        - "extracted_entity_payload.ai_confidence_score"
        - "extracted_entity_payload.domain_entities"
        - "extracted_entity_payload.is_adversarial_attempt"
        - "extracted_entity_payload.is_structured_menu_bypass"
    governance:
      purpose: "Extract bounded agricultural claim entities (district, crop_name, survey_number, land_size_acres, subsidy_scheme_id) under strict Pydantic schema validation (`ExtractedEntityPayload`)"
      data_minimization: true
      logging: true
      fallback: "reprompt_or_escalate_to_human_agent"

  - name: "identity_verify"
    kind: "sector_specific"
    interface: "ZeroTrustIdentityTokenizer.tokenize_id(raw_identifier) + IdentityVerificationService.verify_identity_token(tokenized_citizen_id)"
    provider: "Layer-2 Zero-Trust Security Gateway (HMAC-SHA256) & MOSIP Identity Gateway (POST /v1/identity/verify)"
    io:
      in: ["requester.identifier", "request.payload.tokenized_citizen_id"]
      out: ["request.payload.tokenized_citizen_id", "is_identity_verified"]
    governance:
      purpose: "Tokenize cleartext citizen identifiers in Layer-2 RAM into 64-char hex HMAC-SHA256 tokens (`HmacCitizenToken`) using `AGRISTACK_PEPPER_SECRET` and verify active identity status in MOSIP without transmitting raw PII"
      data_minimization: true
      logging: true
      fallback: "auto_reject_identity_not_verified"

  - name: "session_deduplicate"
    kind: "sector_specific"
    interface: "LedgerPersistenceService.record_extraction_attempt(payload_id, session_id, attempt_id, ...)"
    provider: "PostgreSQL / SQLite Deduplication View (`staging_committed_extractions`)"
    io:
      in: ["request.payload.session_id", "attempt_count", "extracted_entity_payload"]
      out: ["committed_payload_id", "processing_state"]
    governance:
      purpose: "Supersede prior conversational retry turns (`SUPERSEDED`) and expose only the latest `COMMITTED` extraction attempt for registry cross-matching and analytics"
      data_minimization: true
      logging: true
      fallback: "escalate_to_human_agent"

  - name: "registry_search"
    kind: "sector_specific"
    interface: "AgriRegistryService.verify_land_record(tokenized_citizen_id, land_record_id) + G2pConnectMapperService.build_registry_search_envelope(...)"
    provider: "Federated AgriStack Cadastral Land Registry (POST /v1/land/cadastral/verify & G2P Connect v1.0.0 search/on-search)"
    io:
      in:
        - "request.payload.tokenized_citizen_id"
        - "extracted_entity_payload.domain_entities.survey_number"
        - "extracted_entity_payload.domain_entities.district"
        - "extracted_entity_payload.domain_entities.crop_name"
      out: ["is_land_verified", "land_record_id"]
    governance:
      purpose: "Verify cadastral land parcel ownership and seasonal crop entitlement using pseudonymized identity tokens"
      data_minimization: true
      logging: true
      fallback: "auto_reject_land_record_not_found"

  - name: "social_registry_check"
    kind: "sector_specific"
    interface: "SocialRegistryService.query_beneficiary_eligibility(tokenized_citizen_id, scheme_id) + LedgerPersistenceService.fetch_approved_payouts_ledger()"
    provider: "OpenSPP / OpenG2P Social Protection Registry (POST /v1/social/eligibility) & Governance Ledger"
    io:
      in: ["request.payload.tokenized_citizen_id", "active_season"]
      out: ["is_scheme_eligible", "has_duplicate_active_claim"]
    governance:
      purpose: "Verify social protection scheme entitlement and enforce seasonal anti-double-dipping (`(tokenized_citizen_id, active_season)`)"
      data_minimization: true
      logging: true
      fallback: "escalate_to_human_agent"

  - name: "check_benefit_eligibility"
    kind: "sector_specific"
    interface: "ClaimAdjudicator.evaluate_claim(claim_evaluation_payload)"
    provider: "Deterministic Three-Gate Governance Engine (`ClaimOrchestrator` Gate 2 & `ClaimAdjudicator` Gate 3)"
    io:
      in:
        - "extracted_entity_payload.ai_confidence_score"
        - "extracted_entity_payload.is_adversarial_attempt"
        - "is_identity_verified"
        - "is_land_verified"
        - "has_duplicate_active_claim"
        - "attempt_count"
      out:
        - "governance_outcome.eligibility_status"
        - "governance_outcome.governance_action"
        - "governance_outcome.disbursement_txn_id"
        - "governance_outcome.escalation_case_id"
        - "governance_outcome.rejection_reason"
    governance:
      purpose: "Enforce Gate 2 mandatory entity completeness (3-strike reprompt ceiling) and Gate 3 deterministic >=0.85 confidence and registry verification matrix"
      data_minimization: true
      logging: true
      fallback: "escalate_to_human_agent"

  - name: "payment_disburse"
    kind: "sector_specific"
    interface: "PaymentRailService.initiate_disbursement(governance_outcome) + G2pConnectMapperService.build_disbursement_envelope(...)"
    provider: "G2P Connect (DCI) v1.0.0 Disbursement Mapper & NPCI APBS / PFMS Treasury Rail (POST /v1/payments/disburse)"
    io:
      in: ["request.payload.tokenized_citizen_id", "governance_outcome.disbursement_txn_id", "governance_outcome.governance_action"]
      out: ["disbursement_callback.disbursement_txn_id", "disbursement_callback.bank_reference_id", "disbursement_callback.disbursement_status"]
    governance:
      purpose: "Emit cryptographically signed, idempotent G2P Connect v1.0.0 disbursement instructions and reconcile monotonic forward-only (`PENDING -> INITIATED -> SUCCESS/FAILED/RETURNED`) settlement callbacks"
      data_minimization: true
      logging: true
      fallback: "stage_for_manual_treasury_reconciliation"

  - name: "human_review"
    kind: "sector_specific"
    interface: "CaseManagementService.stage_incident_ticket(case_payload) + CaseManagementService.process_officer_review(review_outcome)"
    provider: "District Agricultural Officer HITL Adjudication Queue (GET /v1/caseworker/cases & POST /v1/caseworker/cases/{escalation_case_id}/review)"
    io:
      in: ["governance_outcome.escalation_case_id", "request.payload.tokenized_citizen_id", "extracted_entity_payload"]
      out: ["staged_case_id", "application_status"]
    governance:
      purpose: "Stage low-confidence (<0.85), max-retry, or adversarial claims as `SPP-CASE-YYYY-XXXXXX` tickets for human caseworker adjudication with mandatory officer `review_notes`"
      data_minimization: true
      logging: true
      fallback: "escalate_to_human_agent"

  - name: "text_to_speech"
    kind: "foundational"
    interface: "MultichannelNotificationService.dispatch_notification(notification_request) + BhashiniService.synthesize_speech(text, language_locale)"
    provider: "Digital India BHASHINI TTS Hub (POST /v1/tts/synthesize) & Multi-Channel Outbound Notification Gateway"
    io:
      in:
        - "request.payload.channel_type"
        - "request.payload.language_locale"
        - "governance_outcome.governance_action"
        - "governance_outcome.disbursement_txn_id"
        - "governance_outcome.escalation_case_id"
        - "governance_outcome.rejection_reason"
      out: ["transmission_ack"]
    governance:
      purpose: "Deliver accessible IVR voice (TTS audio), WhatsApp rich Markdown card, USSD session response, and transactional SMS confirmation receipts (`<=160` chars) with toll-free helpline `1800-180-1551` on rejections"
      data_minimization: true
      logging: true
      fallback: "send_transactional_sms_receipt"

# ==============================================================================
# Callable UN Universal DPI Safeguards Block
# Reference: Vision Paper Page 18 & Page 21 ("Safeguards as Callable AI Blocks")
# ==============================================================================
safeguards:
  enabled: true
  callable_ai_block: "verify_zero_trust_safeguards()"
  checks:
    - "consent_present"
    - "purpose_limitation"
    - "data_minimization"
    - "zero_cleartext_pii_retention"
    - "adversarial_prompt_injection_firewall"
    - "non_discrimination"
    - "explainability_ready"
  on_failure:
    action: "escalate"
    to: "district_agricultural_officer_hitl"
    citizen_message: >-
      Your subsidy claim has been safely queued for assisted review by a
      District Agricultural Officer. Your reference Case ID has been sent via SMS.

# ==============================================================================
# Auditable 12-Step DPI Workflow Sequence
# ==============================================================================
steps:
  - id: "step_01_consent_and_channel_entry"
    call: "verify_zero_trust_safeguards()"
    condition: "request.payload.channel_type in ['IVR_VOICE', 'WHATSAPP', 'USSD', 'SMS']"
    description: "Layer-2 Ingestion Firewall (`IngestionFirewall.process_ingress`): verify carrier webhook signature (`CarrierAuthValidator`), enforce token-bucket rate limits, capture explicit channel-native consent in `consent_registry`, redact free-text PII (`PiiPurgeGuard.redact_all`), and tokenize `originating_phone_number` in volatile RAM into a 64-char hex `tokenized_citizen_id` (`ZeroTrustIdentityTokenizer.tokenize_id`) BEFORE any AI block is invoked."
    on_success: "step_02_speech_to_text_transcription"
    on_failure:
      action: "stop"
      to: "district_agricultural_officer_hitl"
      citizen_message: "Explicit consent and valid carrier authentication are required. Session closed without storing any data."

  - id: "step_02_speech_to_text_transcription"
    call: "speech_to_text"
    condition: "request.payload.channel_type == 'IVR_VOICE' or (request.payload.channel_type == 'WHATSAPP' and request.payload.payload_type == 'AUDIO')"
    description: "Transcribe incoming 8kHz GSM/PSTN rural telephony or 16kHz PCM voice stream / WhatsApp audio note via BHASHINI ASR (`transcribe_audio`); on transcription failure, emit deterministic low-confidence (`0.40`) fallback payload for human review. Bypassed for text WhatsApp, SMS, and USSD."
    on_success: "step_03_text_translation_and_normalization"
    on_failure:
      action: "fallback"
      retry: { max_attempts: 2, backoff: "exponential" }
      to: "step_08_governance_threshold_evaluation"
      citizen_message: "Audio quality was unclear. Routing your application to an assisted caseworker."

  - id: "step_03_text_translation_and_normalization"
    call: "translate"
    condition: "request.payload.channel_type in ['IVR_VOICE', 'WHATSAPP', 'SMS'] and request.payload.structure_level == 'FREE_TEXT'"
    description: "Translate free-text vernacular script (from IVR ASR, WhatsApp, or SMS) into standardized administrative text via BHASHINI NMT (`translate_text`) while enforcing `AdversarialPromptFirewall` checks; bypass for deterministic `DTMF_SELECTION` (USSD) and `MENU_SELECTION` (WhatsApp interactive menus)."
    on_success: "step_04_structured_field_entity_extraction"
    on_failure:
      action: "escalate"
      retry: { max_attempts: 2, backoff: "exponential" }
      to: "district_agricultural_officer_hitl"
      citizen_message: "We could not translate your message automatically. A District Officer will review your request."

  - id: "step_04_structured_field_entity_extraction"
    call: "structured_extract"
    condition: "request.payload.channel_type in ['IVR_VOICE', 'WHATSAPP', 'SMS'] and request.payload.structure_level == 'FREE_TEXT'"
    description: "Extract canonical claim entities (`district`, `crop_name`, `survey_number`) from free-text IVR Voice, WhatsApp, or SMS via sovereign SLM (`SlmExtractor.extract_entities`); force security zeroing (`ai_confidence_score = 0.0`) immediately if `is_adversarial_attempt == true`. Structured USSD (`DTMF_SELECTION`) and WhatsApp (`MENU_SELECTION`) inputs bypass SLM with `is_structured_menu_bypass = true` and `ai_confidence_score = 1.0`."
    on_success: "step_05_identity_perimeter_tokenization"
    on_failure:
      action: "fallback"
      to: "step_08_governance_threshold_evaluation"
      citizen_message: "Please clarify your district and damaged crop so we can verify your land record."

  - id: "step_05_identity_perimeter_tokenization"
    call: "identity_verify"
    description: "Assert zero cleartext PII (`PiiPurgeGuard.assert_zero_pii`) on the 64-character lowercase hex `tokenized_citizen_id` (`HmacCitizenToken`, `^[a-fA-F0-9]{64}$`) and verify active citizen identity status against the authoritative MOSIP identity gateway (`IdentityVerificationService.verify_identity_token`)."
    on_success: "step_05b_analytical_session_deduplication"
    on_failure:
      action: "fallback"
      to: "step_08_governance_threshold_evaluation"
      citizen_message: "Your identity token could not be verified in the farmer registry."

  - id: "step_05b_analytical_session_deduplication"
    call: "session_deduplicate"
    condition: "request.payload.channel_type in ['IVR_VOICE', 'WHATSAPP', 'SMS']"
    description: "Record the extraction turn in `session_extraction_details`, mark prior conversational turns as `SUPERSEDED`, and expose only the latest `COMMITTED` turn (`attempt_id`) via the `staging_committed_extractions` view so abandoned retries never trigger duplicate registry searches."
    on_success: "step_06_agricultural_registry_crossmatch"
    on_failure:
      action: "escalate"
      to: "district_agricultural_officer_hitl"
      citizen_message: "Session state error detected. Escalating to a human caseworker."

  - id: "step_06_agricultural_registry_crossmatch"
    call: "registry_search"
    description: "Verify cadastral land parcel ownership and seasonal crop entitlement (`AgriRegistryService.verify_land_record`) and emit signed G2P Connect v1.0.0 `search` / `on-search` envelopes (`G2pConnectMapperService.build_registry_search_envelope`) using only `tokenized_citizen_id` and `survey_number` (`land_record_id`)."
    on_success: "step_07_social_benefits_registry_submission"
    on_failure:
      action: "fallback"
      to: "step_08_governance_threshold_evaluation"
      citizen_message: "Your land or seasonal crop record could not be automatically matched."

  - id: "step_07_social_benefits_registry_submission"
    call: "social_registry_check"
    condition: "is_identity_verified == true and is_land_verified == true"
    description: "Verify beneficiary scheme entitlement in the OpenSPP / OpenG2P social protection registry (`SocialRegistryService.query_beneficiary_eligibility`) and check `application_governance_ledger` for seasonal anti-double-dipping (`(tokenized_citizen_id, active_season)`)."
    on_success: "step_08_governance_threshold_evaluation"
    on_failure:
      action: "fallback"
      to: "step_08_governance_threshold_evaluation"
      citizen_message: "Evaluating claim eligibility against scheme ledger rules."

  - id: "step_08_governance_threshold_evaluation"
    call: "check_benefit_eligibility"
    description: "Evaluate Three-Gate Governance Matrix in `ClaimOrchestrator` and `ClaimAdjudicator.evaluate_claim`: Gate 1 (modality & adversarial zeroing check `is_adversarial_attempt == false`), Gate 2 (mandatory `district` and `crop_name` completeness with 3-strike conversational retry ceiling `attempt_count < 3`), and Gate 3 (`ai_confidence_score >= 0.85`, `is_identity_verified == true`, `is_land_verified == true`, and `has_duplicate_active_claim == false`)."
    on_success: "step_09_governance_routing_engine"
    on_failure:
      action: "fallback"
      to: "step_09_governance_routing_engine"
      citizen_message: "Evaluating routing path based on governance thresholds."

  - id: "step_09_governance_routing_engine"
    call: "check_benefit_eligibility"
    description: "Render deterministic `GovernanceOutcomePayload`: (a) `AUTO_APPROVE` (`ELIGIBLE`) -> route to `step_10` automated payout, (b) `REQUEST_MORE_INFO` (`REQUIRES_REVIEW`) -> conversational re-prompt via `step_12` if missing mandatory entities and `attempt_count < 3` on IVR Voice, WhatsApp, or SMS, (c) `ROUTE_FOR_MANUAL_REVIEW` (`REQUIRES_REVIEW`) -> route to `step_11` human caseworker queue (`SPP-CASE-YYYY-XXXXXX`) if `ai_confidence_score < 0.85`, `is_adversarial_attempt == true`, or `attempt_count >= 3`, or (d) `AUTO_REJECT` (`INELIGIBLE`) -> route to `step_12` with deterministic `RejectionReasonCode` (`DUPLICATE_CLAIM_ACTIVE_SEASON`, `IDENTITY_NOT_VERIFIED`, or `LAND_RECORD_NOT_FOUND`)."
    on_success: "step_10_automated_payout_disbursement"
    on_failure:
      action: "escalate"
      to: "step_11_caseworker_incident_staging"
      citizen_message: "Routing your application based on governance determination."

  - id: "step_10_automated_payout_disbursement"
    call: "payment_disburse"
    condition: "governance_outcome.governance_action in ['AUTO_APPROVE', 'AUTOMATED_PAYOUT', 'MANUAL_APPROVE']"
    description: "Dispatch payout instruction via `PaymentRailService.initiate_disbursement` and emit signed G2P Connect (DCI) v1.0.0 `disburse` envelope (`G2pConnectMapperService.build_disbursement_envelope`) with idempotency key `disbursement_txn_id` (`PENDING -> INITIATED -> SUCCESS/FAILED/RETURNED`), reconciled via `/v1/webhooks/g2p-connect/on-disburse` and `/v1/webhooks/payments/callback`."
    on_success: "step_12_adaptive_multichannel_confirmation_delivery"
    on_failure:
      action: "escalate"
      to: "step_11_caseworker_incident_staging"
      citizen_message: "Treasury settlement requires officer verification. Your Case ID has been generated."

  - id: "step_11_caseworker_incident_staging"
    call: "human_review"
    condition: "governance_outcome.governance_action in ['ROUTE_FOR_MANUAL_REVIEW', 'HUMAN_REVIEW']"
    description: "Stage cryptographically tracked `SPP-CASE-YYYY-XXXXXX` ticket via `CaseManagementService.stage_incident_ticket` (`GET /v1/caseworker/cases` and `POST /v1/caseworker/cases/{escalation_case_id}/review`) for District Agricultural Officer HITL adjudication with full redacted audit context."
    on_success: "step_12_adaptive_multichannel_confirmation_delivery"
    on_failure:
      action: "stop"
      to: "district_agricultural_officer_hitl"
      citizen_message: "Your claim is queued for priority officer review."

  - id: "step_12_adaptive_multichannel_confirmation_delivery"
    call: "text_to_speech"
    condition: "request.payload.channel_type in ['IVR_VOICE', 'WHATSAPP', 'USSD', 'SMS']"
    description: "Dispatch localized notification via `MultichannelNotificationService.dispatch_notification` across the citizen's native channel (BHASHINI TTS audio URL for `IVR_VOICE`, localized Markdown card for `WHATSAPP`, compact `<=160`-char plain text for `USSD` and `SMS`) carrying `disbursement_txn_id`, `escalation_case_id`, `missing_entity` clarification, or `rejection_reason` with toll-free helpline `1800-180-1551`."
    on_success: "workflow_completed"
    on_failure:
      action: "fallback"
      to: "district_agricultural_officer_hitl"
      citizen_message: "Confirmation SMS queued via backup telecom gateway."

outputs:
  status: "success | escalated | reprompt | rejected | failed"
  decision:
    schema_ref: "src/data_models/governance/governance_outcome_payload.py#GovernanceOutcomePayload"
    session_id: "string"
    payload_id: "string"
    eligibility_status: "ELIGIBLE | INELIGIBLE | REQUIRES_REVIEW | PENDING_VERIFICATION"
    governance_action: "AUTO_APPROVE | AUTOMATED_PAYOUT | AUTO_REJECT | ROUTE_FOR_MANUAL_REVIEW | HUMAN_REVIEW | REQUEST_MORE_INFO | MANUAL_APPROVE | MANUAL_REJECT"
    disbursement_txn_id: "string | null"
    disbursement_status: "PENDING | INITIATED | SUCCESS | FAILED | RETURNED | null"
    escalation_case_id: "string | null"
    rejection_reason: "IDENTITY_NOT_VERIFIED | LAND_RECORD_NOT_FOUND | CROP_MISMATCH | DUPLICATE_CLAIM_ACTIVE_SEASON | INCOMPLETE_APPLICATION | ADVERSARIAL_OR_INELIGIBLE_INPUT | null"
  audit_trail_ref: "application_governance_ledger_history.history_id"

logging:
  level: "INFO"
  destination: "stdout | postgresql_append_only_ledger"
  format: "json"
  events:
    - "workflow_started"
    - "consent_verified"
    - "ai_block_called"
    - "pii_tokenized_at_perimeter"
    - "safeguards_checked"
    - "registry_crossmatched"
    - "decision_made"
    - "g2p_connect_envelope_dispatched"
    - "escalation_triggered"
    - "workflow_completed"
  redaction:
    pii_fields:
      - "requester.identifier"
      - "requester.consent_token"
      - "originating_phone_number"
      - "phone_number"
      - "caller_phone_number"
      - "sender_phone_number"
      - "aadhaar_number"
      - "farmer_id_cleartext"
