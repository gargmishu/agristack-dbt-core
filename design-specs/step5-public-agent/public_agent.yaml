# ==============================================================================
# CDPI 2026 DPI-AI Framework — Canonical Public Agent Specification (YAML)
# Reference: https://digitalpublicinfrastructure.ai/public-agents.php
# Vision Paper Template: Pages 23–25 ("Generic Public Agent Spec + DPI Workflow Integration Template (YAML)")
# Implementation: https://github.com/gargmishu/agristack-dbt-core
# ==============================================================================

public_agent:
  id: "pa-farmer-subsidy-gateway-2026"
  version: "1.0.0"
  description: >-
    Constrained, multilingual citizen-facing Public Agent that guides smallholder
    farmers through seasonal crop-loss subsidy and Direct Benefit Transfer (DBT)
    applications across IVR Voice, WhatsApp, USSD (*147#), and SMS, activating the
    governed DPI Workflow without autonomous decision-making authority.
  channels: ["ivr_voice", "whatsapp", "ussd", "sms"]
  languages: ["hi-IN", "en-IN", "mr-IN", "te-IN", "ta-IN", "gu-IN", "kn-IN", "bn-IN", "pa-IN", "or-IN", "ml-IN"]

  ai_model:
    # Plug-and-play adapter for sovereign or local inference ecosystems
    adapter: "vllm"  # openai | anthropic | google | ollama | vllm | tgi | azure_openai | bedrock | custom
    runtime: "on_prem"  # external_api | sovereign_cloud | on_prem
    endpoint: "http://localhost:8000/v1/extract"
    endpoint_env: "SLM_API_ENDPOINT"
    model: "sovereign-slm-8b-q4"
    auth_ref: "env://SLM_API_KEY"
    interface: "chat_completions"  # messages | chat_completions (mapped by LiveSlmExtractor to POST /v1/extract)
    timeout_ms: 2000
    parameters:
      temperature: 0.0
      max_tokens: 512

  capabilities:
    - "intent_interpretation"
    - "workflow_selection"
    - "multilingual_entity_extraction"
    - "plain_language_explanations"

  constraints:
    - "no_final_decisions_outside_workflows"
    - "no_data_access_without_consent"
    - "allow_only_listed_workflows"
    - "zero_cleartext_pii_persistence"
    - "cannot_modify_authoritative_registries"
    - "cannot_initiate_payments_directly"

  permissions:
    can_invoke_workflows:
      - "wf-crop-loss-subsidy-2026"
    can_call_ai_blocks_directly: false

  required_context:
    identity:
      required: true
      fields: ["requester.identifier"]
      tokenization_standard: "HMAC-SHA256 (Layer-2 Perimeter -> 64-char hex HmacCitizenToken)"
      pepper_secret_env: "AGRISTACK_PEPPER_SECRET"
    consent:
      required: true
      fields: ["requester.consent_token"]
      channels_supported: ["ivr_dtmf_1", "whatsapp_interactive_optin", "ussd_menu_1", "sms_optin_keyword"]

  workflow_invocation:
    engine_endpoint: "http://localhost:8000/v1/webhooks/{channel}"
    entrypoint_class: "src/public_agent/public_agent_api.py#PublicAgentApi.process_raw_ingress"
    orchestrator_class: "src/orchestrator/claim_orchestrator.py#ClaimOrchestrator.execute_orchestration_cycle"
    ingress_webhooks:
      whatsapp: "POST /v1/webhooks/whatsapp"
      ivr_voice: "POST /v1/webhooks/ivr"
      ussd: "POST /v1/webhooks/ussd"
      sms: "POST /v1/webhooks/sms"
    dpi_callbacks:
      g2p_connect_on_search: "POST /v1/webhooks/g2p-connect/on-search"
      g2p_connect_on_disburse: "POST /v1/webhooks/g2p-connect/on-disburse"
      payment_settlement_callback: "POST /v1/webhooks/payments/callback"
    mode: "invoke_by_id"
    request_shape:
      workflow_id: "wf-crop-loss-subsidy-2026"
      inputs: "src/data_models/public_agent/standardized_intake_payload.py#PublicAgentStandardizedIntakePayload"
      context:
        identity: "src/data_models/common/field_types.py#HmacCitizenToken"
        consent: "consent_registry.consent_id"
    response_shape:
      status: "success | escalated | reprompt | rejected | failed"
      decision: "src/data_models/governance/governance_outcome_payload.py#GovernanceOutcomePayload"
      explanation: "src/data_models/notification/outbound_notification_payload.py#OutboundNotificationPayload"
      transmission_ack: "src/data_models/notification/transmission_ack.py#TransmissionAck"
      audit_trail_ref: "application_governance_ledger_history.history_id"

  runtime_behavior:
    intent_to_workflow_mapping:
      method: "rules_then_model"
      structured_menu_fast_path_bypass: true
      allow_only_listed_workflows: true
    escalation:
      on:
        - "safeguards_failure"
        - "adversarial_prompt_injection_detected"
        - "low_confidence_below_0_85"
        - "registry_mismatch_or_not_found"
        - "max_conversational_retries_exceeded"
        - "appeal_requested"
      to_human_agent: "district_agricultural_officer_hitl"
      response_sla: "48h"
    logging:
      audit_logging: true
      redact_fields:
        - "requester.identifier"
        - "requester.consent_token"
        - "originating_phone_number"
        - "phone_number"
        - "caller_phone_number"
        - "sender_phone_number"
        - "aadhaar_number"
        - "farmer_id_cleartext"

  governance:
    owner_agency: "Department of Agriculture & Farmers Welfare (Sovereign / State Nodal Agency)"
    legal_basis: "Digital Personal Data Protection (DPDP) Act 2023 & Sovereign Direct Benefit Transfer (DBT) Authorization Mandate"
    audit_logging: true
    pii_handling: "hmac_sha256_tokenize_at_perimeter_zero_disk_retention"
    human_recourse:
      enabled: true
      channel: "any"
      helpline_number_env: "HELPLINE_NUMBER"
      default_helpline: "1800-180-1551"
      caseworker_queue_endpoint: "GET /v1/caseworker/cases"
      adjudication_endpoint: "POST /v1/caseworker/cases/{escalation_case_id}/review"
      audit_funnel_endpoint: "GET /v1/audit/funnel"
      audit_history_endpoint: "GET /v1/audit/history/{claim_id}"
      response_sla: "48h"
