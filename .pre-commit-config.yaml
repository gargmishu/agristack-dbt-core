repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff
        name: Ruff Linter
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: Ruff Formatter
        entry: .venv/bin/ruff format
        language: system
        types: [python]
        require_serial: true

      - id: mypy
        name: Mypy Type Checker
        entry: .venv/bin/mypy src tests
        language: system
        pass_filenames: false

      - id: architecture-standards
        name: Architecture & Clean Code Compliance
        entry: .venv/bin/pytest tests/unit/test_standards_compliance.py
        language: system
        pass_filenames: false
